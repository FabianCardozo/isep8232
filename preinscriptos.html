<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acceso institucional | ISEP N° 8232</title>
  <link rel="icon" href="assets/logo_isep.jpg">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <main>
    <section class="page-hero">
      <div class="wrap">
        <div class="crumbs">Área institucional</div>
        <h1>Fichas de preinscripción</h1>
        <p>Ingreso solo con el correo institucional y la contraseña del área interna.</p>
      </div>
    </section>
    <section class="section">
      <div class="wrap">
        <div id="adminLogin" class="admin-lock">
          <h2 style="color:var(--plum);margin-bottom:8px">Ingreso institucional</h2>
          <p style="color:var(--muted);margin-bottom:14px">Correo: instituto8232@gmail.com</p>
          <div class="field"><label>Correo institucional</label><input type="email" id="adminEmail" autocomplete="off" placeholder="instituto8232@gmail.com"></div>
          <div class="field" style="margin-top:10px"><label>Contraseña</label><input type="password" id="adminPass" autocomplete="off"></div>
          <button class="btn btn-orange" type="button" id="btnAdminLogin" style="margin-top:14px">Ingresar</button>
          <p id="adminError" style="display:none;margin-top:12px;color:#9b1c1c"></p>
        </div>

        <div id="adminPanel" class="hidden">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:12px;flex-wrap:wrap">
            <p><b id="count">0</b> fichas en este equipo</p>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button class="btn btn-orange" id="btnExport" type="button">Exportar CSV</button>
              <button class="btn btn-outline" id="btnAdminSalir" type="button">Salir</button>
            </div>
          </div>
          <div id="listadoCarreras"></div>
        </div>
      </div>
    </section>
  </main>
  <script src="assets/js/site.js"></script>
  <script>
  (function () {
    var KEY = "isep_preinscriptos_v1";
    var SESSION = "isep_admin_ok";
    var PASS_KEY = "isep_admin_pass_v1";
    var EMAIL_OK = "instituto8232@gmail.com";
    var PASS_INICIAL = "ISEP8232";
    var GRUPOS = [
      { key: "inicial", titulo: "Profesorado en Educación Inicial" },
      { key: "primaria", titulo: "Profesorado en Educación Primaria" },
      { key: "terapeutico", titulo: "Acompañante Terapéutico" },
      { key: "licenciatura", titulo: "Licenciatura en Educación Inicial" }
    ];
    try { localStorage.removeItem(PASS_KEY); } catch (e) {}
    function passActual() { return PASS_INICIAL; }
    function loadAll() {
      try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; }
    }
    function esc(v) {
      return String(v == null || v === "" ? "—" : v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }
    function docsTexto(d) {
      var p = [];
      if (d.docsTitulo) p.push("Título o constancia");
      if (d.docsSalud) p.push("Certificado de salud");
      if (d.docsDni) p.push("DNI ambas caras");
      if (d.docsFotos) p.push("Dos fotos 4x4");
      if (d.docsFolio) p.push("Un folio");
      return p.length ? p.join(" · ") : "—";
    }
    function fichaHTML(d) {
      var foto = d.foto ? "<img class='foto-4x4' src='" + d.foto + "' alt='Foto 4x4'>" : "<div class='foto-4x4'></div>";
      var extra = d.carrera === "licenciatura"
        ? "<div class='ficha-row'><span>Título de base</span><b>" + esc(d.tituloBase) + "</b></div><div class='ficha-row'><span>Institución</span><b>" + esc(d.institucionTitulo) + "</b></div>"
        : "<div class='ficha-row'><span>Título secundario</span><b>" + esc(d.tituloSec) + "</b></div><div class='ficha-row'><span>Institución</span><b>" + esc(d.institucionSec) + "</b></div>";
      return "<div class='ficha'>" +
        "<div class='ficha-top'><div class='ficha-izq'><b>" + esc(d.id) + "</b><div>" + esc(d.fecha) + "</div>" + foto + "</div>" +
        "<div style='flex:1;text-align:center'><div style='font-size:.75rem'>INSTITUTO SUPERIOR DE EDUCACIÓN PROFESIONAL</div>" +
        "<h2>Solicitud de preinscripción</h2><div>ISEP N° 8232 · Hipólito Yrigoyen 686<br>instituto8232@gmail.com</div></div>" +
        "<img src='assets/logo_isep.jpg' alt='ISEP' width='64' height='64'></div>" +
        "<div class='ficha-row'><span>Carrera</span><b>" + esc(d.carreraNombre) + "</b></div>" +
        "<div class='ficha-row'><span>Apellidos</span><b>" + esc(d.apellidos) + "</b></div>" +
        "<div class='ficha-row'><span>Nombres</span><b>" + esc(d.nombres) + "</b></div>" +
        "<div class='ficha-row'><span>Documento</span><b>" + esc((d.tipoDoc || "DNI") + " " + (d.dni || "")) + "</b></div>" +
        "<div class='ficha-row'><span>Nacimiento</span><b>" + esc(d.lugarNac) + " · " + esc(d.fechaNac) + "</b></div>" +
        extra +
        "<div class='ficha-row'><span>Domicilio</span><b>" + esc([d.calle, d.numero, d.localidad, d.provincia].join(" ")) + "</b></div>" +
        "<div class='ficha-row'><span>Contacto</span><b>" + esc(d.celular) + " · " + esc(d.email) + "</b></div>" +
        "<div class='ficha-row'><span>Documentación</span><b>" + esc(docsTexto(d)) + "</b></div>" +
        "<div class='ficha-firmas'><div class='firma-linea'>Firma del / de la aspirante<br>" + esc(d.nombres) + " " + esc(d.apellidos) + " · DNI " + esc(d.dni) + "</div><div class='firma-linea'>Aclaración y DNI</div></div>" +
        "<div class='ficha-recibido'><strong>RECIBIDO — uso institucional</strong>Fecha de recepción (DD/MM/AAAA): ____ / ____ / ________</div>" +
        "</div>";
    }
    function descargarFicha(d) {
      var html = "<!DOCTYPE html><html lang='es-AR'><head><meta charset='UTF-8'><title>" + esc(d.id) + "</title>" +
        "<style>@page{size:A4 portrait;margin:12mm}body{font-family:Arial,sans-serif;color:#222;padding:8mm}.ficha{border:2px solid #1f3b36;padding:16px}.ficha-top{display:flex;justify-content:space-between;gap:12px;border-bottom:2px solid #1f3b36;padding-bottom:8px}.ficha-izq{width:120px;font-size:12px}.foto-4x4{width:28mm;height:28mm;object-fit:cover;border:1px solid #333;margin-top:8px;display:block}.ficha-row{display:grid;grid-template-columns:200px 1fr;border-bottom:1px dotted #999;padding:5px 0;font-size:14px}.ficha-firmas{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:28px}.firma-linea{border-top:1px solid #333;padding-top:8px;min-height:70px;font-size:13px}.ficha-recibido{margin-top:20px;border:1px dashed #333;padding:10px}</style></head><body>" +
        fichaHTML(d) + "</body></html>";
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([html], { type: "text/html;charset=utf-8" }));
      a.download = (d.id || "ficha") + ".html";
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    var loginBox = document.getElementById("adminLogin");
    var panel = document.getElementById("adminPanel");
    var err = document.getElementById("adminError");
    window.ISEP_DESCARGAR = descargarFicha;

    function pintar() {
      var rows = loadAll();
      document.getElementById("count").textContent = rows.length;
      var box = document.getElementById("listadoCarreras");
      if (!rows.length) {
        box.innerHTML = "<p>Todavía no hay fichas generadas en esta computadora.</p>";
        return;
      }
      window.ISEP_ROWS = rows;
      box.innerHTML = GRUPOS.map(function (g) {
        var lista = rows.filter(function (r) { return r.carrera === g.key; });
        var cuerpo = lista.length ? lista.map(function (r, idx) {
          var i = rows.indexOf(r);
          return "<tr><td>" + esc(r.id) + "</td><td>" + esc(r.fecha) + "</td><td>" + esc(r.apellidos) + ", " + esc(r.nombres) +
            "</td><td>" + esc(r.dni) + "</td><td>" + esc(r.celular) + "<br>" + esc(r.email) +
            "</td><td><button class='btn btn-orange' type='button' onclick='ISEP_DESCARGAR(ISEP_ROWS[" + i + "])'>Descargar ficha</button></td></tr>";
        }).join("") : "<tr><td colspan='6'>No hay preinscriptos en esta oferta.</td></tr>";
        return "<section style='margin-bottom:28px'><h2 style='color:var(--plum);margin-bottom:8px'>" + g.titulo + " <small style='color:#6a6570'>(" + lista.length + ")</small></h2>" +
          "<div style='overflow:auto;border-radius:14px;box-shadow:var(--shadow)'><table class='data'><thead><tr><th>Código</th><th>Fecha</th><th>Aspirante</th><th>DNI</th><th>Contacto</th><th></th></tr></thead><tbody>" +
          cuerpo + "</tbody></table></div></section>";
      }).join("");
    }
    function abrir() { loginBox.classList.add("hidden"); panel.classList.remove("hidden"); pintar(); }
    function cerrar() { sessionStorage.removeItem(SESSION); panel.classList.add("hidden"); loginBox.classList.remove("hidden"); }
    if (sessionStorage.getItem(SESSION) === "1") abrir();
    document.getElementById("btnAdminLogin").onclick = function () {
      var mail = (document.getElementById("adminEmail").value || "").trim().toLowerCase();
      var pass = document.getElementById("adminPass").value || "";
      if (mail !== EMAIL_OK) { err.style.display = "block"; err.textContent = "El correo tiene que ser instituto8232@gmail.com"; return; }
      if (pass !== passActual()) { err.style.display = "block"; err.textContent = "Contraseña incorrecta."; return; }
      err.style.display = "none";
      sessionStorage.setItem(SESSION, "1");
      abrir();
    };
    document.getElementById("btnAdminSalir").onclick = cerrar;
    document.getElementById("btnExport").onclick = function () {
      var rows = loadAll();
      if (!rows.length) return alert("No hay fichas para exportar.");
      var cols = ["id","fecha","carreraNombre","apellidos","nombres","dni","email","celular","localidad"];
      var lines = [cols.join(";")].concat(rows.map(function (r) {
        return cols.map(function (c) { return '"' + String(r[c] || "").replace(/"/g, "'") + '"'; }).join(";");
      }));
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob(["\uFEFF" + lines.join("\n")], { type: "text/csv;charset=utf-8" }));
      a.download = "preinscriptos-isep-8232.csv";
      a.click();
    };
  })();
  </script>
</body>
</html>
