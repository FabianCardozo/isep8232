NI';const confirmation='ELIMINAR';if(!confirm('ATENCIÓN: vas a eliminar definitivamente esta ficha.\\n\\nAspirante: '+name+'\\nDNI: '+dni+'\\nCódigo: '+code+'\\n\\nEsta acción no se puede deshacer. ¿Continuar?'))return;const typed=prompt('Para confirmar la eliminación de la ficha '+code+', escribí exactamente ELIMINAR:');if(typed!==confirmation){notice('Eliminación cancelada.');return}const {error}=await db.rpc('isep_eliminar_ficha',{p_id:r.id});if(error){notice('No se eliminó la ficha. La función segura de eliminación debe configurarse en Supabase: '+error.message);return}rows=rows.filter(x=>x.id!==r.id);$('modal').close();render();notice('Ficha eliminada. Actualizá el listado para verificar el resultado.')};init()})();
