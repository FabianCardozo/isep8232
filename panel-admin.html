<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel administrativo | ISEP 8232</title><style>
body{margin:0;background:#f8f5f7;color:#332d32;font:16px system-ui}header{background:#642b52;color:white;padding:20px}main{max-width:1150px;margin:auto;padding:16px}section{background:white;border:1px solid #ddd;border-radius:14px;padding:20px;margin:15px 0}input,select,button{padding:11px;border-radius:8px;border:1px solid #ccc;font:inherit}button{background:#167e75;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}.filters{display:flex;flex-wrap:wrap;gap:10px}.filters input{flex:2}.stats{display:flex;gap:15px;flex-wrap:wrap}.stats div{padding:12px;background:#f2edf0;border-radius:8px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}dialog{max-width:850px;width:90vw;max-height:85vh;overflow:auto;border:0;border-radius:14px}#details div{padding:7px;border-bottom:1px solid #eee;overflow-wrap:anywhere}#details b{display:inline-block;min-width:160px}#message{color:#63274e} @media print{header,#login,#filters,#actions,#message,#close{display:none!important}dialog{position:static;max-height:none;width:100%;border:0}body{background:white}}

#modal{padding:0;width:min(92vw,850px);max-width:850px;background:white}#close{margin:12px 16px}#details{padding:12px 26px 22px;color:#27242b}.sheet-head{display:flex;align-items:center;gap:16px;border-bottom:4px solid #642b52;padding-bottom:15px}.sheet-emblem{width:60px;height:60px;border:2px solid #642b52;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#642b52;font-size:21px;flex-shrink:0}.sheet-head h2{font-size:20px;margin:0;color:#642b52}.sheet-head p{margin:4px 0;font-size:12px}.sheet-title{text-align:center;margin:18px 0}.sheet-title h3{margin:0;font-size:18px;text-transform:uppercase;letter-spacing:1px}.sheet-code{font-size:12px;overflow-wrap:anywhere;margin:7px 0}.sheet-meta{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#555}.sheet-section{margin:18px 0 0}.sheet-section h4{background:#f0e6ed;color:#642b52;padding:8px 10px;margin:0;font-size:13px;text-transform:uppercase;letter-spacing:.5px}.sheet-fields{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.sheet-field{padding:8px 4px;border-bottom:1px solid #ddd;min-width:0;overflow-wrap:anywhere}.sheet-field.wide{grid-column:1/-1}.sheet-field .field-label{display:block;font-size:10px;text-transform:uppercase;color:#625c61;letter-spacing:.5px}.sheet-field .field-value{font-size:13px;font-weight:600}.sheet-foot{border-top:1px solid #bbb;margin-top:22px;padding-top:10px;font-size:11px;color:#666}.sheet-signatures{display:flex;justify-content:space-between;gap:40px;margin-top:55px;text-align:center;font-size:11px}.sheet-signatures span{border-top:1px solid #777;padding-top:5px;min-width:40%}#actions{padding:0 26px 18px} @media(max-width:520px){#details{padding:12px 14px}.sheet-fields{grid-template-columns:1fr}.sheet-head h2{font-size:16px}} @page{size:A4;margin:12mm}@media print{html,body{background:#fff!important}body>header,main,#close,#actions{display:none!important}#modal{display:block!important;position:static!important;inset:auto!important;margin:0!important;padding:0!important;border:0!important;width:100%!important;max-width:none!important;max-height:none!important;overflow:visible!important;box-shadow:none!important}#details{padding:0!important}.sheet-fields{grid-template-columns:1fr 1fr}.sheet-section{break-inside:avoid}.sheet-signatures{margin-top:42px}}
.sheet-logo{width:76px;height:76px;object-fit:contain;flex-shrink:0}@media print{.sheet-logo{print-color-adjust:exact;-webkit-print-color-adjust:exact}}</style></head><body><header><h1>ISEP N.º 8232 · Administración de preinscripciones</h1></header><main><section id="login"><h2>Ingreso autorizado</h2><form id="loginForm"><input id="email" type="email" placeholder="Correo" required autocomplete="username"><input id="password" type="password" placeholder="Contraseña" required autocomplete="current-password"><button>Ingresar</button></form></section><div id="dashboard" hidden><section><button id="logout">Cerrar sesión</button><h2>Resumen</h2><div class="stats"><div>Total: <b id="total">0</b></div><div>Posibles duplicados: <b id="dups">0</b></div><div>Pruebas: <b id="tests">0</b></div></div></section><section id="filters"><h2>Buscar solicitudes</h2><div class="filters"><input id="search" placeholder="DNI, apellido, nombre o código"><select id="career"><option value="">Todas las carreras</option><option value="inicial">Inicial</option><option value="primaria">Primaria</option><option value="terapeutico">Acompañante terapéutico</option><option value="licenciatura">Licenciatura</option></select><select id="kind"><option value="">Todas</option><option value="duplicates">Duplicadas</option><option value="tests">Pruebas</option></select><button id="refresh">Actualizar</button></div></section><section><h2>Preinscripciones</h2><div class="scroll"><table><thead><tr><th>Fecha</th><th>Nombre</th><th>DNI</th><th>Carrera</th><th>Estado</th><th>Ficha</th></tr></thead><tbody id="rows"></tbody></table></div><button id="more">Cargar más</button></section></div><p id="message" role="status"></p></main><dialog id="modal"><button id="close">Cerrar</button><div id="details"></div><p id="actions"><button id="print">Imprimir / PDF</button> <button id="mark">Marcar como prueba</button> <button id="remove" style="background:#9d263b">Eliminar ficha</button></p></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script><script src="assets/js/supabase-config.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=v=>String(v??'').replace(/\D/g,'');let db,rows=[],offset=0,more=true,active=null,authorized=false;const BATCH=500;function notice(s){$('message').textContent=s}function data(r){return r.datos||{}}function dupes(){const m=new Map();rows.forEach(r=>{const k=norm(data(r).dni);if(k)m.set(k,(m.get(k)||0)+1)});return m}function render(){const dm=dupes(),q=$('search').value.trim().toLowerCase(),career=$('career').value,kind=$('kind').value;const found=rows.filter(r=>{const d=data(r);if(career&&d.carrera!==career)return false;if(kind==='tests'&&!r.admin_es_prueba)return false;if(kind==='duplicates'&&!(norm(d.dni)&&dm.get(norm(d.dni))>1))return false;return [d.nombres,d.apellidos,d.dni,d.id,r.id].join(' ').toLowerCase().includes(q)});$('total').textContent=rows.length;$('dups').textContent=rows.filter(r=>norm(data(r).dni)&&dm.get(norm(data(r).dni))>1).length;$('tests').textContent=rows.filter(r=>r.admin_es_prueba).length;$('more').hidden=!more;$('rows').innerHTML=found.map(r=>{const d=data(r);return '<tr><td>'+esc(new Date(r.created_at).toLocaleString('es-AR'))+'</td><td>'+esc(d.apellidos)+' '+esc(d.nombres)+'</td><td>'+esc(d.dni)+'</td><td>'+esc(d.carreraNombre||d.carrera)+'</td><td>'+(r.admin_es_prueba?'Prueba':'')+(norm(d.dni)&&dm.get(norm(d.dni))>1?' · Posible duplicado':'')+'</td><td><button data-id="'+esc(r.id)+'">Ver ficha</button></td></tr>'}).join('')||'<tr><td colspan="6">No hay coincidencias</td></tr>'}async function load(reset=false){if(!authorized)return;if(reset){rows=[];offset=0;more=true}if(!more)return;const {data:items,error}=await db.from('isep_preinscripciones').select('id,created_at,datos').order('created_at',{ascending:false}).range(offset,offset+BATCH-1);if(error){notice('Error de consulta: '+error.message);return}rows.push(...items.map(x=>({...x,admin_es_prueba:false})));offset+=items.length;more=items.length===BATCH;render();notice('Registros cargados: '+rows.length+(more?' (cargar más para revisar todos los duplicados)':'')+'. Gestión de pruebas aún no habilitada.')}async function signed(session){authorized=false;rows=[];active=null;$('dashboard').hidden=true;$('login').hidden=!!session;if(!session)return;$('login').hidden=false;notice('Comprobando permisos administrativos…');const {data:ok,error}=await db.rpc('isep_es_admin');if(error||ok!==true){notice('La cuenta inició sesión, pero falta configurar la función de autorización isep_es_admin en Supabase. No se han modificado registros.');await db.auth.signOut();$('login').hidden=false;return}authorized=true;$('login').hidden=true;$('dashboard').hidden=false;await load()}function field(label,value,wide=false){if(value===undefined||value===null||String(value).trim()==='')return '';const display=typeof value==='boolean'?(value?'Sí':'No'):String(value);return '<div class="sheet-field'+(wide?' wide':'')+'"><span class="field-label">'+esc(label)+'</span><span class="field-value">'+esc(display)+'</span></div>'}function group(title,entries){const body=entries.map(x=>field(x[0],x[1],!!x[2])).join('');return body?'<div class="sheet-section"><h4>'+esc(title)+'</h4><div class="sheet-fields">'+body+'</div></div>':''}function show(r){active=r;const d=data(r),v=(...keys)=>{for(const k of keys){if(d[k]!==undefined&&d[k]!==null&&String(d[k]).trim()!=='')return d[k]}return ''},yn=x=>x===true||x==='true'||x==='on'?'Sí':x===false||x==='false'?'No':x;const code=v('id')||r.id,when=new Date(r.created_at).toLocaleString('es-AR');$('details').innerHTML='<div class="sheet-head"><img class="sheet-logo" src="assets/logo_isep.jpg" alt="Logo oficial del ISEP N.º 8232"><div><h2>Instituto Superior de Educación Profesional N.º 8232</h2><p>San Ramón de la Nueva Orán · Salta · Argentina</p></div></div><div class="sheet-title"><h3>Ficha de preinscripción</h3><div class="sheet-code"><strong>Código:</strong> '+esc(code)+'</div><div class="sheet-meta"><span>Ciclo lectivo: '+esc(String(v('fecha')||when).slice(-4))+'</span><span>Registro: '+esc(when)+'</span></div></div>'+group('01 · Carrera solicitada',[['Carrera',v('carreraNombre','carrera'),true],['Estado',v('estado')]])+group('02 · Datos personales',[['Apellidos',v('apellidos')],['Nombres',v('nombres')],['Tipo de documento',v('tipoDoc')],['DNI',v('dni')],['CUIL',v('cuil')],['Fecha de nacimiento',v('fechaNac')],['Edad declarada',v('edad')],['Sexo',v('sexo')],['Nacionalidad',v('nacionalidad')],['Estado civil',v('estadoCivil')],['Lugar de nacimiento',v('lugarNac'),true]])+group('03 · Domicilio y contacto',[['Calle',v('calle')],['Número',v('numero')],['Localidad',v('localidad')],['Provincia',v('provincia')],['Teléfono',v('telefono')],['Celular',v('celular')],['Correo electrónico',v('email'),true]])+group('04 · Estudios previos',[['Institución secundaria',v('institucionSec'),true],['Título secundario',v('tituloSec'),true],['Año de egreso',v('anioEgreso')],['Trabaja',v('trabaja')]])+group('05 · Documentación declarada',[['DNI',yn(v('docsDni'))],['Fotos',yn(v('docsFotos'))],['Certificado de salud',yn(v('docsSalud'))],['Título secundario',yn(v('docsTitulo'))],['Folio',yn(v('docsFolio'))]])+'<div class="sheet-foot">Constancia generada a partir de los datos declarados por la persona aspirante. No acredita inscripción definitiva ni validación documental.</div><div class="sheet-signatures"><span>Firma de la persona aspirante</span><span>Recepción institucional</span></div>';$('mark').disabled=true;$('mark').title='Pendiente de habilitación';$('remove').disabled=false;$('remove').title='Requiere autorización y confirmación';$('modal').showModal()}async function init(){try{db=supabase.createClient(ISEP_CLOUD.url,ISEP_CLOUD.key,{auth:{persistSession:true,autoRefreshToken:true}});const {data:{session}}=await db.auth.getSession();await signed(session)}catch(e){notice('No se pudo iniciar el panel: '+e.message)}}$('loginForm').onsubmit=async e=>{e.preventDefault();const {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){notice(error.message);return}await signed(data.session)};$('logout').onclick=async()=>{await db.auth.signOut();await signed(null)};$('refresh').onclick=()=>load(true);$('more').onclick=()=>load();['search','career','kind'].forEach(id=>$(id).oninput=render);$('rows').onclick=e=>{const b=e.target.closest('button[data-id]');if(b){const r=rows.find(x=>x.id===b.dataset.id);if(r)show(r)}};$('close').onclick=()=>$('modal').close();$('print').onclick=()=>window.print();$('mark').onclick=async()=>{if(!active)return;const next=!active.admin_es_prueba;const {error}=await db.rpc('isep_marcar_prueba',{p_id:active.id,p_es_prueba:next});if(error){notice(error.message);return}active.admin_es_prueba=next;render();$('modal').close();notice(next?'Marcada como prueba.':'Marca retirada.')};$('remove').onclick=async()=>{if(!active||!authorized)return;const r=active,d=data(r),code=d.id||r.id,name=[d.apellidos,d.nombres].filter(Boolean).join(' '),dni=d.dni||'Sin DNI';const confirmation='ELIMINAR';if(!confirm('ATENCIÓN: vas a eliminar definitivamente esta ficha.\\n\\nAspirante: '+name+'\\nDNI: '+dni+'\\nCódigo: '+code+'\\n\\nEsta acción no se puede deshacer. ¿Continuar?'))return;const typed=prompt('Para confirmar la eliminación de la ficha '+code+', escribí exactamente ELIMINAR:');if(typed!==confirmation){notice('Eliminación cancelada.');return}const {error}=await db.rpc('isep_eliminar_ficha',{p_id:r.id});if(error){notice('No se eliminó la ficha. La función segura de eliminación debe configurarse en Supabase: '+error.message);return}rows=rows.filter(x=>x.id!==r.id);$('modal').close();render();notice('Ficha eliminada. Actualizá el listado para verificar el resultado.')};init()})();
</script></body></html>
