<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel administrativo | ISEP 8232</title><style>
body{margin:0;background:#f8f5f7;color:#332d32;font:16px system-ui}header{background:#642b52;color:white;padding:20px}main{max-width:1150px;margin:auto;padding:16px}section{background:white;border:1px solid #ddd;border-radius:14px;padding:20px;margin:15px 0}input,select,button{padding:11px;border-radius:8px;border:1px solid #ccc;font:inherit}button{background:#167e75;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}.filters{display:flex;flex-wrap:wrap;gap:10px}.filters input{flex:2}.stats{display:flex;gap:15px;flex-wrap:wrap}.stats div{padding:12px;background:#f2edf0;border-radius:8px}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #ddd}dialog{max-width:850px;width:90vw;max-height:85vh;overflow:auto;border:0;border-radius:14px}#details div{padding:7px;border-bottom:1px solid #eee;overflow-wrap:anywhere}#details b{display:inline-block;min-width:160px}#message{color:#63274e} @media print{header,#login,#filters,#actions,#message,#close{display:none!important}dialog{position:static;max-height:none;width:100%;border:0}body{background:white}}
</style></head><body><header><h1>ISEP N.º 8232 · Administración de preinscripciones</h1></header><main><section id="login"><h2>Ingreso autorizado</h2><form id="loginForm"><input id="email" type="email" placeholder="Correo" required autocomplete="username"><input id="password" type="password" placeholder="Contraseña" required autocomplete="current-password"><button>Ingresar</button></form></section><div id="dashboard" hidden><section><button id="logout">Cerrar sesión</button><h2>Resumen</h2><div class="stats"><div>Total: <b id="total">0</b></div><div>Posibles duplicados: <b id="dups">0</b></div><div>Pruebas: <b id="tests">0</b></div></div></section><section id="filters"><h2>Buscar solicitudes</h2><div class="filters"><input id="search" placeholder="DNI, apellido, nombre o código"><select id="career"><option value="">Todas las carreras</option><option value="inicial">Inicial</option><option value="primaria">Primaria</option><option value="terapeutico">Acompañante terapéutico</option><option value="licenciatura">Licenciatura</option></select><select id="kind"><option value="">Todas</option><option value="duplicates">Duplicadas</option><option value="tests">Pruebas</option></select><button id="refresh">Actualizar</button></div></section><section><h2>Preinscripciones</h2><div class="scroll"><table><thead><tr><th>Fecha</th><th>Nombre</th><th>DNI</th><th>Carrera</th><th>Estado</th><th>Ficha</th></tr></thead><tbody id="rows"></tbody></table></div><button id="more">Cargar más</button></section></div><p id="message" role="status"></p></main><dialog id="modal"><button id="close">Cerrar</button><h2>Ficha de preinscripción</h2><div id="details"></div><p id="actions"><button id="print">Imprimir / PDF</button> <button id="mark">Marcar como prueba</button> <button id="remove">Eliminar prueba</button></p></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script><script src="assets/js/supabase-config.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),norm=v=>String(v??'').replace(/\D/g,'');let db,rows=[],offset=0,more=true,active=null,authorized=false;const BATCH=500;function notice(s){$('message').textContent=s}function data(r){return r.datos||{}}function dupes(){const m=new Map();rows.forEach(r=>{const k=norm(data(r).dni);if(k)m.set(k,(m.get(k)||0)+1)});return m}function render(){const dm=dupes(),q=$('search').value.trim().toLowerCase(),career=$('career').value,kind=$('kind').value;const found=rows.filter(r=>{const d=data(r);if(career&&d.carrera!==career)return false;if(kind==='tests'&&!r.admin_es_prueba)return false;if(kind==='duplicates'&&!(norm(d.dni)&&dm.get(norm(d.dni))>1))return false;return [d.nombres,d.apellidos,d.dni,d.id,r.id].join(' ').toLowerCase().includes(q)});$('total').textContent=rows.length;$('dups').textContent=rows.filter(r=>norm(data(r).dni)&&dm.get(norm(data(r).dni))>1).length;$('tests').textContent=rows.filter(r=>r.admin_es_prueba).length;$('more').hidden=!more;$('rows').innerHTML=found.map(r=>{const d=data(r);return '<tr><td>'+esc(new Date(r.created_at).toLocaleString('es-AR'))+'</td><td>'+esc(d.apellidos)+' '+esc(d.nombres)+'</td><td>'+esc(d.dni)+'</td><td>'+esc(d.carreraNombre||d.carrera)+'</td><td>'+(r.admin_es_prueba?'Prueba':'')+(norm(d.dni)&&dm.get(norm(d.dni))>1?' · Posible duplicado':'')+'</td><td><button data-id="'+esc(r.id)+'">Ver ficha</button></td></tr>'}).join('')||'<tr><td colspan="6">No hay coincidencias</td></tr>'}async function load(reset=false){if(!authorized)return;if(reset){rows=[];offset=0;more=true}if(!more)return;const {data:items,error}=await db.from('isep_preinscripciones').select('id,created_at,datos,admin_es_prueba').order('created_at',{ascending:false}).range(offset,offset+BATCH-1);if(error){notice('Error de consulta: '+error.message);return}rows.push(...items);offset+=items.length;more=items.length===BATCH;render();notice('Registros cargados: '+rows.length+(more?' (cargar más para revisar todos los duplicados)':''))}async function signed(session){authorized=false;rows=[];active=null;$('dashboard').hidden=true;$('login').hidden=!!session;if(!session)return;$('login').hidden=false;notice('Comprobando permisos administrativos…');const {data:ok,error}=await db.rpc('isep_es_admin');if(error||ok!==true){notice('La cuenta inició sesión, pero falta configurar la función de autorización isep_es_admin en Supabase. No se han modificado registros.');await db.auth.signOut();$('login').hidden=false;return}authorized=true;$('login').hidden=true;$('dashboard').hidden=false;await load()}function show(r){active=r;const d=data(r);$('details').innerHTML='<p><b>Código:</b> '+esc(d.id||r.id)+'</p>'+Object.entries(d).filter(([k])=>k!=='foto').map(([k,v])=>'<div><b>'+esc(k)+'</b> '+esc(v)+'</div>').join('');$('mark').textContent=r.admin_es_prueba?'Quitar marca de prueba':'Marcar como prueba';$('remove').disabled=!r.admin_es_prueba;$('modal').showModal()}async function init(){try{db=supabase.createClient(ISEP_CLOUD.url,ISEP_CLOUD.key,{auth:{persistSession:true,autoRefreshToken:true}});const {data:{session}}=await db.auth.getSession();await signed(session)}catch(e){notice('No se pudo iniciar el panel: '+e.message)}}$('loginForm').onsubmit=async e=>{e.preventDefault();const {data,error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){notice(error.message);return}await signed(data.session)};$('logout').onclick=async()=>{await db.auth.signOut();await signed(null)};$('refresh').onclick=()=>load(true);$('more').onclick=()=>load();['search','career','kind'].forEach(id=>$(id).oninput=render);$('rows').onclick=e=>{const b=e.target.closest('button[data-id]');if(b){const r=rows.find(x=>x.id===b.dataset.id);if(r)show(r)}};$('close').onclick=()=>$('modal').close();$('print').onclick=()=>window.print();$('mark').onclick=async()=>{if(!active)return;const next=!active.admin_es_prueba;const {error}=await db.rpc('isep_marcar_prueba',{p_id:active.id,p_es_prueba:next});if(error){notice(error.message);return}active.admin_es_prueba=next;render();$('modal').close();notice(next?'Marcada como prueba.':'Marca retirada.')};$('remove').onclick=async()=>{if(!active||!active.admin_es_prueba)return;const id=active.id;if(!confirm('¿Eliminar DEFINITIVAMENTE la prueba '+(data(active).id||id)+'?'))return;const {error}=await db.rpc('isep_eliminar_prueba',{p_id:id});if(error){notice(error.message);return}rows=rows.filter(r=>r.id!==id);$('modal').close();render();notice('Solicitud de prueba eliminada.')};init()})();
</script></body></html>
